# Ghostwriter configuration. Edit and restart (or press the reload item in the tray menu).

[hotkeys]
# Hold this to record; release to transcribe and paste. You press Enter yourself.
# Right Alt is the default because nothing else uses it: no editor, shell or browser binds it,
# so nothing is stolen while Ghostwriter runs. Any chord works too, e.g. "ctrl+shift+space".
push_to_talk = "right alt"
# Same as push_to_talk, but presses Enter automatically after pasting.
# Empty = disabled. Set it to a chord (e.g. "ctrl+shift+space") if you ever want hands-free send.
push_to_talk_send = ""
# Press once to start, press again to stop. Hands-free long dictation.
toggle = "ctrl+shift+d"
# Cancel an in-progress recording without pasting anything.
cancel = "esc"

[wakeword]
# Say the wake phrase to start dictating without touching the keyboard.
enabled = true
# "whisper"      - works out of the box with any phrase, nothing to train. An energy gate
#                  watches the mic for free and only decodes short speech bursts.
# "openwakeword" - the classic tiny-ONNX detector. Lower CPU when you are talking a lot, but
#                  it needs a model trained per phrase (see README).
backend = "whisper"
# The phrase itself. Change it to anything; no retraining, just restart.
phrase = "hey ghost"
# Extra spellings to accept. Whisper writes what it hears, and short invented names come back
# spelled several ways.
aliases = ["hey goast", "hey gost", "hey ghosts", "hey ghost writer"]
# whisper backend: how close the transcript must be to the phrase, 0..1. Lower if it misses
# you, raise if it fires on similar-sounding speech.
# openwakeword backend: the model's confidence threshold, where 0.5 is the usual starting point.
threshold = 0.8
# whisper backend: how sure the voice-activity detector must be that a sound is speech before
# it is worth decoding, 0..1. Raise it if a noisy room keeps the decoder busy.
vad_threshold = 0.5
# Ignore further detections for this long after one fires.
cooldown_sec = 2.0

# --- whisper backend ---
# Wake-word decoding model. Keep it small; this is a keyword check, not dictation.
model = "tiny.en"
# "cpu" leaves the GPU entirely to dictation. "cuda" + "float16" if you would rather not
# spend the CPU.
device = "cpu"
compute_type = "int8"

# --- openwakeword backend ---
# Path to a trained .onnx. The filename doubles as the phrase name shown in the UI.
model_path = ""
# Used when model_path is missing. Pretrained options: hey_jarvis, alexa, hey_mycroft,
# hey_rhasspy, timer, weather.
fallback_model = "hey_jarvis"

[endpoint]
# How a hands-free utterance ends. Only applies to wake-word dictation.
# Stop after this much silence.
silence_timeout_sec = 1.2
# RMS below this counts as silence. Raise in a noisy room.
silence_threshold = 0.012
# Ignore blips shorter than this when deciding that speech has started.
min_speech_sec = 0.4
# If you never start talking after the wake word, give up after this long.
lead_in_sec = 2.0
# Hard cap on a single hands-free utterance.
max_duration_sec = 60.0
# Press this key to stop and transcribe immediately instead of waiting for silence.
stop_key = "down"

[model]
# tiny.en | base.en | small.en | medium.en | distil-large-v3 | large-v3-turbo
name = "large-v3-turbo"
# "cuda" or "cpu". On RTX 50-series (Blackwell/sm_120) compute_type MUST be float16;
# int8_float16 crashes cuBLAS with CUBLAS_STATUS_NOT_SUPPORTED.
device = "cuda"
compute_type = "float16"
language = "en"
# Words/phrases Whisper tends to get wrong. Fed in as an initial prompt.
vocabulary = [
    "Claude Code",
    "Ghostwriter",
    "ctranslate2",
    "faster-whisper",
    "uv",
    "npm",
    "git rebase",
    "kubectl",
    "async",
    "repo",
    "stdout",
]

[audio]
sample_rate = 16000
# Recordings shorter than this are discarded as accidental key taps.
min_duration_sec = 0.35
max_duration_sec = 300.0
# Trim silence and skip non-speech chunks before decoding.
vad = true
# Optional: input device name substring, e.g. "Microphone (Realtek". Empty = system default.
device = ""

[overlay]
# Colour of the recording pill: the waveform bars, the glow, the border and the wave that
# sweeps the screen. Only recording uses it — the states below keep their own meaning.
# Design palette: "#38bdf8" blue, "#ef4444" red, "#22c55e" green, "#a855f7" purple.
accent = "#38bdf8"
# Frame interval in ms. 16 is ~60fps. Raise it if the animation costs you too much CPU.
frame_ms = 16
# How long the idle dot takes to bloom and stretch into the waveform.
activate_ms = 560
# How long the rings hugging the pill keep expanding.
rings_ms = 1200
# How long "Pasted" and error messages stay up before the pill hides itself.
hold_ms = 1400

[overlay.colors]
# Per-state colours. Recording is not here: it wears `accent`.
idle = "#6b7280"
transcribing = "#f59e0b"
done = "#22c55e"
error = "#ef4444"
moving = "#38bdf8"

[overlay.wave]
# The wave that sweeps the whole display when recording starts.
enabled = true
# How many crests are in the train, and how far apart they set off.
crests = 8
duration_ms = 1700
stagger_ms = 140
# Where a crest is born, and how far past the farthest corner it travels before expiring.
# Raise overshoot if the wave seems to stop before the screen edge.
start_radius = 20
overshoot = 40
# The bloom left under the pill as the wave departs. flash_ms = 0 turns it off.
flash_ms = 420
flash_rings = 14
# Width of the buffer the wave is drawn into before it is scaled to your display. Bigger is
# crisper and costs more, roughly linearly: 960 measures ~5ms a frame, 1280 ~7ms.
buffer_width = 960
# Each crest's glow is drawn as bands stepping outward from its centre line. More/wider bands
# make a broader, softer glow.
band_steps = 14
band_step_px = 4
# Higher concentrates the light into a tighter core.
falloff = 3.4
# Peak alpha at the centre of a crest. Past about 1.4 the crests clip to flat painted rings
# instead of reading as light.
intensity = 1.15
# Crest colours, cycled through the train: deep halo, bright core.
halos = ["#0c38e8", "#1044ff", "#2464ff", "#1852f6"]
cores = ["#96e0ff", "#38bdf8", "#6ec8ff", "#56cdfc"]

[output]
# Paste via clipboard + Ctrl+V, then restore the previous clipboard contents.
paste = true
# Delay before restoring the old clipboard, in seconds. Raise if pastes come out empty.
clipboard_restore_delay = 0.35
# Play a short beep on record start / stop.
sounds = true

[postprocess]
# Strip "um", "uh", "you know", etc.
remove_fillers = true
# Spoken punctuation and formatting commands: "new line", "comma", "open paren"...
voice_commands = true
# Capitalize the first letter and ensure trailing punctuation.
tidy_sentences = true
# Literal find/replace applied last. Great for CLI names Whisper mangles.
[postprocess.replacements]
"get hub" = "GitHub"
"pie test" = "pytest"
"pseudo" = "sudo"
"see LI" = "CLI"
"claw'd code" = "Claude Code"
