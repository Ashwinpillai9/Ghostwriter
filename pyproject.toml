[project]
name = "ghostwriter"
version = "0.1.0"
description = "Local push-to-talk dictation overlay that types into any Windows app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.1.0",
    "ctranslate2>=4.5.0",
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    "keyboard>=0.13.5",
    "pyperclip>=1.9.0",
    "pystray>=0.19.5",
    "openwakeword>=0.6.0",
    "pillow>=10.4",
    # CTranslate2 links against cuBLAS/cuDNN at runtime but does not bundle them.
    "nvidia-cublas-cu12>=12.8",
    "nvidia-cudnn-cu12>=9.7,<10",
]

[project.scripts]
ghostwriter = "ghostwriter.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
